<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">TruthLint</title>
  <desc id="desc">Because done is a claim until the evidence passes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080C18"/>
      <stop offset="1" stop-color="#111C2F"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="1095" cy="105" r="180" fill="#34D399" opacity="0.08" filter="url(#glow)"/>
  <circle cx="115" cy="590" r="210" fill="#60A5FA" opacity="0.07" filter="url(#glow)"/>
  <g transform="translate(88 106)">
    <rect width="98" height="98" rx="22" fill="#10261F" stroke="#34D399" stroke-width="3"/>
    <path d="M27 51 43 67 73 33" fill="none" stroke="#6EE7B7" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="88" y="302" fill="#F8FAFC" font-size="92" font-weight="760" letter-spacing="-4">TruthLint</text>
    <text x="92" y="368" fill="#94A3B8" font-size="30">Because "done" is a claim</text>
    <text x="92" y="412" fill="#94A3B8" font-size="30">until the evidence passes.</text>
    <g transform="translate(92 485)" font-size="20" font-weight="600">
      <rect width="218" height="48" rx="9" fill="#172033" stroke="#334155"/>
      <text x="109" y="31" fill="#CBD5E1" text-anchor="middle">product-aware</text>
      <rect x="234" width="218" height="48" rx="9" fill="#172033" stroke="#334155"/>
      <text x="343" y="31" fill="#CBD5E1" text-anchor="middle">evidence-gated</text>
      <rect x="468" width="218" height="48" rx="9" fill="#172033" stroke="#334155"/>
      <text x="577" y="31" fill="#CBD5E1" text-anchor="middle">fail-closed</text>
    </g>
    <g transform="translate(860 210)">
      <rect width="320" height="258" rx="20" fill="#0C1424" stroke="#27364F"/>
      <circle cx="34" cy="34" r="6" fill="#F87171"/>
      <circle cx="56" cy="34" r="6" fill="#FBBF24"/>
      <circle cx="78" cy="34" r="6" fill="#34D399"/>
      <text x="28" y="94" fill="#94A3B8" font-size="18">claim: done</text>
      <text x="28" y="142" fill="#FBBF24" font-size="18">evidence: missing</text>
      <text x="28" y="178" fill="#F87171" font-size="18">status: blocked</text>
      <path d="M28 207h264" stroke="#27364F"/>
      <text x="28" y="236" fill="#F8FAFC" font-size="17">completion refused</text>
    </g>
  </g>
</svg>
