<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">TruthLint completion flow</title>
  <desc id="desc">Inspect, classify, verify, and pass or block a completion claim.</desc>
  <rect width="1200" height="280" rx="28" fill="#0B1020"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="64" y="72" fill="#F8FAFC" font-size="34" font-weight="700">TruthLint</text>
    <text x="64" y="110" fill="#94A3B8" font-size="18">A completion linter for coding agents</text>
    <g font-size="17" font-weight="600" text-anchor="middle">
      <rect x="64" y="154" width="190" height="66" rx="12" fill="#172033" stroke="#334155"/>
      <text x="159" y="194" fill="#E2E8F0">1. Inspect</text>
      <path d="M274 187h50" stroke="#64748B" stroke-width="2"/>
      <path d="m316 180 10 7-10 7" fill="none" stroke="#64748B" stroke-width="2"/>
      <rect x="346" y="154" width="190" height="66" rx="12" fill="#172033" stroke="#334155"/>
      <text x="441" y="194" fill="#E2E8F0">2. Classify</text>
      <path d="M556 187h50" stroke="#64748B" stroke-width="2"/>
      <path d="m598 180 10 7-10 7" fill="none" stroke="#64748B" stroke-width="2"/>
      <rect x="628" y="154" width="190" height="66" rx="12" fill="#172033" stroke="#334155"/>
      <text x="723" y="194" fill="#E2E8F0">3. Verify</text>
      <path d="M838 187h50" stroke="#64748B" stroke-width="2"/>
      <path d="m880 180 10 7-10 7" fill="none" stroke="#64748B" stroke-width="2"/>
      <rect x="910" y="154" width="226" height="66" rx="12" fill="#10261F" stroke="#34D399"/>
      <text x="1023" y="194" fill="#6EE7B7">4. Pass or block</text>
    </g>
  </g>
</svg>
