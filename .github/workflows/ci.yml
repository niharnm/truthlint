name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest -v scripts/test_task_gate.py
      - name: Exercise the catalog command
        run: python scripts/task_gate.py catalog

  quality:
    name: Format and skill validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Install development tools
        run: python -m pip install "ruff==0.16.6" "skills-ref==0.1.1"
      - name: Check Python
        run: |
          ruff check .
          ruff format --check .
      - name: Validate Agent Skills format
        run: agentskills validate "$GITHUB_WORKSPACE"
